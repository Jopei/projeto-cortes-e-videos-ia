services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cortes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cortes}
      POSTGRES_DB: ${POSTGRES_DB:-cortes}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cortes}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage (SeaweedFS; MinIO no longer ships public images).
  # Credentials are written into the S3 identity config from the env at startup.
  storage:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    entrypoint: >
      /bin/sh -c "
      printf '{\"identities\":[{\"name\":\"app\",\"credentials\":[{\"accessKey\":\"%s\",\"secretKey\":\"%s\"}],\"actions\":[\"Admin\",\"Read\",\"Write\",\"List\",\"Tagging\"]}]}' \"$$S3_ACCESS_KEY\" \"$$S3_SECRET_KEY\" > /etc/s3.json &&
      exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/s3.json
      "
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-cortesadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-cortesadmin}
    ports:
      - "127.0.0.1:${STORAGE_HOST_PORT:-19000}:8333"
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot init container: creates the "media" bucket used by tusd/api/worker.
  storage-init:
    image: chrislusf/seaweedfs:latest
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      echo 's3.bucket.create -name ${S3_BUCKET:-media}' | weed shell -master=storage:9333 || true
      "
    restart: "no"

  # Resumable uploads (tusd) straight into the "media" bucket (SeaweedFS S3). Rights
  # enforcement happens via HTTP hooks against the api (see
  # services/api/app/routers/uploads.py): an upload without metadata.source_id
  # is rejected before it can even start.
  tusd:
    image: tusproject/tusd:latest
    restart: unless-stopped
    command:
      - -behind-proxy
      - -s3-bucket=${S3_BUCKET:-media}
      - -s3-endpoint=http://storage:8333
      - -hooks-http=http://api:8000/api/uploads/tusd-hook
      - -hooks-http-forward-headers=Cookie
      - -hooks-enabled-events=pre-create,post-finish,post-terminate
      - -cors-allow-credentials
      - -cors-allow-origin=${TUSD_CORS_ORIGIN_REGEX:-^http://localhost:13000$}
      - -port=1080
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-cortesadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-cortesadmin}
      AWS_REGION: ${S3_REGION:-us-east-1}
    ports:
      - "127.0.0.1:${TUSD_HOST_PORT:-11080}:1080"
    depends_on:
      storage-init:
        condition: service_completed_successfully
      api:
        condition: service_started

  api:
    build:
      context: ./services/api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://cortes:cortes@postgres:5432/cortes}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://storage:8333}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-18000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    volumes:
      - ./services/api:/app

  worker:
    build:
      context: ./services/worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://cortes:cortes@postgres:5432/cortes}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://storage:8333}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/worker:/app

  # Dockerfile for apps/web is owned by the frontend specialist; this service
  # entry just wires it into the compose network/ports.
  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:18000}
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-13000}:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  storage_data:
